# Frontend en su propio repositorio. Con include, un solo "docker compose up"
# levanta la API, la base, phpMyAdmin y la web.
include:
  - ../periodizacionapp-react/docker-compose.yml

services:
  api:
    build: .
    container_name: periodizacion_api
    # --reload y el volumen son para desarrollo; quitalos en produccion.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"
    environment:
      MYSQL_HOST: db
      MYSQL_PORT: 3306
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    volumes:
      - ./app:/code/app
      - ./migrations:/code/migrations
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  db:
    image: mysql:8.4
    container_name: periodizacion_db
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_unicode_ci
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:?}
      MYSQL_DATABASE: ${MYSQL_DATABASE:?}
      MYSQL_USER: ${MYSQL_USER:?}
      MYSQL_PASSWORD: ${MYSQL_PASSWORD:?}
    ports:
      - "127.0.0.1:${MYSQL_HOST_PORT:-3306}:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      # 127.0.0.1 fuerza TCP: asi no da OK el servidor temporal de la inicializacion.
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -u\"$$MYSQL_USER\" -p\"$$MYSQL_PASSWORD\" --silent"]
      interval: 5s
      timeout: 5s
      retries: 20
      start_period: 20s
    restart: unless-stopped

  phpmyadmin:
    image: phpmyadmin:5
    container_name: periodizacion_phpmyadmin
    environment:
      PMA_HOST: db
      PMA_PORT: 3306
    ports:
      - "127.0.0.1:${PHPMYADMIN_PORT:-8080}:80"
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped

  test:
    build:
      context: .
      target: test
    profiles: ["test"]

volumes:
  mysql_data:
